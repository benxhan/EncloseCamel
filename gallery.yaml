desc: >
  EncloseCamel (inspired by enclose.horse) is a puzzle game in which you build walls
  around a camel on a grid. The goal is to trap the camel inside the LARGEST possible
  area using a limited number of walls, with each free-to-roam tile on the grid giving
  you one point.